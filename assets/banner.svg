<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #cbd5e1;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #38bdf8;
    }

    /* CSS Animations for Dynamic Dynamic Aspects */
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.7; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -100; }
    }
    @keyframes floatNode {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    @keyframes radarSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .radar-line {
      transform-origin: 1000px 200px;
      animation: radarSweep 10s linear infinite;
    }
    .animated-grid {
      animation: pulse 6s ease-in-out infinite;
    }
    .flow-line {
      stroke-dasharray: 8 6;
      animation: dash 5s linear infinite;
    }
    .floating-card {
      animation: floatNode 4s ease-in-out infinite;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />

  <!-- Background Cyber Grid -->
  <g class="animated-grid" opacity="0.15" stroke="#94a3b8" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1200" height="400" fill="url(#grid)" />
  </g>

  <!-- Dynamic Background Graphics (Right Side) -->
  <!-- Radar circles -->
  <g opacity="0.3" transform="translate(1000, 200)">
    <circle r="160" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4"/>
    <circle r="110" fill="none" stroke="#818cf8" stroke-width="1" />
    <circle r="60" fill="none" stroke="#c084fc" stroke-width="1.5" />
    <line x1="-160" y1="0" x2="160" y2="0" stroke="#38bdf8" stroke-width="0.5" />
    <line x1="0" y1="-160" x2="0" y2="160" stroke="#38bdf8" stroke-width="0.5" />
  </g>
  <line class="radar-line" x1="1000" y1="200" x2="1150" y2="150" stroke="#38bdf8" stroke-width="2" opacity="0.5" filter="url(#neonFilter)" />

  <!-- Floating Shield Graphic -->
  <g opacity="0.25" transform="translate(920, 110)">
    <path d="M 80 0 L 160 40 V 110 C 160 170 80 210 80 210 C 80 210 0 170 0 110 V 40 Z" fill="url(#shieldGrad)" stroke="#60a5fa" stroke-width="2" />
  </g>

  <!-- Risk Score Wave Line (Dynamic Background) -->
  <path class="flow-line" d="M 50 340 Q 250 280, 450 330 T 850 290 T 1150 330" fill="none" stroke="url(#primaryGlow)" stroke-width="3" opacity="0.6" filter="url(#neonFilter)"/>

  <!-- Foreground Content Container with Drop Shadow Overlay for Guaranteed Legibility -->
  <g transform="translate(60, 0)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 75)">
      <rect x="0" y="0" width="280" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.9" />
      <text x="18" y="22" class="badge-text">🛡️ REAL-TIME FRAUD DETECTION &amp; AML</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 160)" filter="url(#dropShadow)">
      <text x="0" y="0" class="title">Awesome Automated Online</text>
      <text x="0" y="50" class="title" fill="url(#primaryGlow)">Fraud Detection 🚨</text>
    </g>

    <!-- Subtitle -->
    <g transform="translate(0, 260)" filter="url(#dropShadow)">
      <text x="0" y="0" class="subtitle">Curated Enterprise SaaS Platforms, Real-Time Monitoring &amp; Open-Source ML Engines</text>
      <text x="0" y="30" class="subtitle" font-size="16px" fill="#94a3b8">Updated October 2026 • Transaction Monitoring • Chargeback Guarantees • Graph AI • AML</text>
    </g>
  </g>
</svg>
